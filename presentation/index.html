<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Forge - Lên Ý Tưởng</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .editor-container {
            max-width: 800px;
            width: 100%;
            margin: 60px auto;
            padding: 0 40px;
            flex: 1;
        }

        .title-input {
            width: 100%;
            font-size: 40px;
            font-weight: 700;
            border: none;
            outline: none;
            color: var(--color-text-main);
            margin-bottom: 16px;
            padding: 0;
        }
        .title-input::placeholder { color: #E0E0E0; }

        .content-input {
            width: 100%;
            min-height: 300px;
            border: none;
            outline: none;
            font-size: 16px;
            line-height: 1.6;
            resize: none;
            color: var(--color-text-main);
            padding: 0;
        }
        .content-input::placeholder { color: var(--color-text-muted); }

        .action-bar {
            margin-top: 24px;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid var(--color-border);
            padding-top: 16px;
        }

        .pin-input {
            font-size: 24px;
            letter-spacing: 8px;
            text-align: center;
            width: 140px;
            padding: 8px;
            margin: 16px 0;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">
            <div class="logo-icon"></div>
            Product Forge
        </a>
        <div style="display: flex; gap: 12px; align-items: center;">
            <button class="btn-secondary" onclick="openTrackModal()">Tra cứu Ý Tưởng</button>
            <a href="admin.html" class="btn-primary">Quản Trị Viên</a>
        </div>
    </header>

    <main class="editor-container">
        <input type="text" class="title-input" placeholder="Tiêu đề ý tưởng..." id="ideaTitle">
        <textarea class="content-input" id="ideaContent" placeholder="Viết mô tả chi tiết ý tưởng của bạn... Nhấn Enter để thêm dòng."></textarea>
        
        <div class="action-bar">
            <button class="btn-accent" id="startBtn" disabled onclick="submitIdea()">Gửi Cố vấn AI ↗</button>
        </div>
    </main>

    <!-- Success Modal -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-box">
            <div style="font-size: 32px; margin-bottom: 12px;">✅</div>
            <h2 style="font-size: 18px; font-weight: 600; margin-bottom: 8px;">Đã ghi nhận ý tưởng</h2>
            <p style="color: var(--color-text-muted); font-size: 14px; margin-bottom: 16px;">Mã định danh theo dõi của bạn:</p>
            <div style="font-size: 24px; font-weight: 700; color: var(--color-text-main); background: var(--color-bg-secondary); padding: 8px; border-radius: 4px; display: inline-block;">#IDEA-826</div>
            
            <p style="color: var(--color-text-muted); font-size: 14px; margin-top: 24px;">Tạo mã PIN bảo mật (4 số):</p>
            <input type="password" class="pin-input" maxlength="4" placeholder="••••" id="createPin">
            
            <div style="margin-top: 16px;">
                <button class="btn-primary" style="width: 100%;" onclick="goToChat()">Mở luồng Thảo luận</button>
            </div>
        </div>
    </div>

    <!-- Track Modal -->
    <div class="modal-overlay" id="trackModal">
        <div class="modal-box" style="text-align: left;">
            <h2 style="font-size: 18px; font-weight: 600; margin-bottom: 16px;">Tra cứu Ý tưởng</h2>
            <label style="font-size: 13px; color: var(--color-text-muted); margin-bottom: 4px; display: block;">Mã Ý Tưởng</label>
            <input type="text" placeholder="VD: IDEA-826" style="width: 100%; margin-bottom: 12px;">
            <label style="font-size: 13px; color: var(--color-text-muted); margin-bottom: 4px; display: block;">Mã PIN</label>
            <input type="password" placeholder="••••" style="width: 100%; margin-bottom: 24px;">
            
            <div style="display: flex; justify-content: flex-end; gap: 8px;">
                <button class="btn-secondary" onclick="closeTrackModal()">Hủy</button>
                <button class="btn-primary" onclick="goToChat()">Tra cứu</button>
            </div>
        </div>
    </div>

    <script>
        const ideaContent = document.getElementById('ideaContent');
        const ideaTitle = document.getElementById('ideaTitle');
        const startBtn = document.getElementById('startBtn');
        
        function checkInput() {
            if (ideaContent.value.trim().length > 5 && ideaTitle.value.trim().length > 2) {
                startBtn.removeAttribute('disabled');
            } else {
                startBtn.setAttribute('disabled', 'true');
            }
        }

        ideaContent.addEventListener('input', checkInput);
        ideaTitle.addEventListener('input', checkInput);

        function submitIdea() {
            document.getElementById('successModal').classList.add('open');
        }

        function openTrackModal() {
            document.getElementById('trackModal').classList.add('open');
        }

        function closeTrackModal() {
            document.getElementById('trackModal').classList.remove('open');
        }

        function goToChat() {
            window.location.href = 'chat.html';
        }
    </script>
</body>
</html>
