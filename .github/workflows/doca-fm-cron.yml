name: DOCA FM Daily Curation Cron

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  curation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          submodules: 'true'
          token: ${{ secrets.SUBMODULE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Diagnostic Env Check
        run: |
          if [ -z "${{ secrets.PUBLIC_SUPABASE_URL }}" ]; then
            echo "WARNING: PUBLIC_SUPABASE_URL secret is EMPTY!"
          else
            echo "SUCCESS: PUBLIC_SUPABASE_URL secret is configured."
          fi
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "WARNING: SUPABASE_SERVICE_ROLE_KEY secret is EMPTY!"
          else
            echo "SUCCESS: SUPABASE_SERVICE_ROLE_KEY secret is configured."
          fi

      - name: Run Curation Script
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python doca-affiliate-web/scripts/cron_curator.py

